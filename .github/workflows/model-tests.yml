name: model tests

on:
  push:
    branches: ["**"]
    paths:
      - "model/**"
      - ".github/workflows/model-tests.yml"
  pull_request:
    paths:
      - "model/**"
      - ".github/workflows/model-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: model
    steps:
      - uses: actions/checkout@v4

      # PySpark cần JVM (data.py/features.py dùng Spark trước khi convert
      # sang pandas để train — xem model/README.md).
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: model/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test (pytest)
        run: uv run pytest -q
