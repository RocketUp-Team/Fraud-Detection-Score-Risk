[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ieee-cis-fraud-pipeline"
version = "1.0.0"
description = "Reproducible IEEE-CIS Spark preprocessing and fraud-data preparation pipeline"
requires-python = ">=3.11"
dependencies = [
  "pyspark==3.5.1",
  "pandas==2.2.2",
  "numpy==1.26.4",
  "pyarrow==16.1.0",
  "matplotlib==3.9.0",
]

[project.scripts]
ieee-cis-preprocess = "pipeline.cli:main"
ieee-cis-verify = "pipeline.verify_processed:main"

[tool.setuptools.packages.find]
where = ["."]
