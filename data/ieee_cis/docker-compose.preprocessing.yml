services:
  preprocess:
    build:
      context: .
      dockerfile: docker/Dockerfile.preprocessing
    image: ieee-cis-preprocess:latest
    environment:
      PROJECT_ROOT: /app
      IEEE_CIS_DATA_DIR: /app/data/raw
      IEEE_CIS_OUTPUT_DIR: /app/data/processed/ieee_cis_spark
      HADOOP_HOME: /opt/hadoop
      SPARK_DRIVER_MEMORY: "8g"
      SPARK_DRIVER_MAX_RESULT_SIZE: "1g"
      # Limit concurrent JVM tasks so the 12 GB container does not exhaust heap.
      SPARK_MASTER: local[4]
      SPARK_SHUFFLE_PARTITIONS: "64"
      SPARK_DEFAULT_PARALLELISM: "8"
      RUN_FULL_PROFILE: "true"
      RUN_MODEL_DEMO: "true"
      WRITE_WIDE_FEATURE_STORE: "true"
      IMBALANCE_RATIO: "4.0"
      PIPELINE_SEED: "42"
    volumes:
      # Compose resolves bind mounts relative to this file, not the shell cwd.
      - ../../data/data/ieee-fraud-detection:/app/data/raw:ro
      - ../../data/processed:/app/data/processed
    deploy:
      resources:
        limits:
          memory: 12g
    command: ["python", "/app/pipeline/data_processing_eda.py"]
    restart: "no"

  verify-processed:
    image: ieee-cis-preprocess:latest
    entrypoint: ["python", "/app/pipeline/verify_processed.py"]
    environment:
      IEEE_CIS_OUTPUT_DIR: /app/data/processed/ieee_cis_spark
    volumes:
      - ../../data/processed:/app/data/processed:ro
    restart: "no"
