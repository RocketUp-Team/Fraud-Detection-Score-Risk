services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud
      POSTGRES_DB: fraud
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://fraud:fraud@db:5432/fraud
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

  # --- Spark: chỉ dùng cho training (model/), không cần cho demo chấm điểm.
  # Chạy: docker compose --profile training run --rm model-training uv run python -m fraud_model.train_baseline
  spark-master:
    image: bitnami/spark:3.5
    environment:
      - SPARK_MODE=master
    ports:
      - "8080:8080"
      - "7077:7077"
    profiles: ["training"]

  spark-worker:
    image: bitnami/spark:3.5
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    depends_on:
      - spark-master
    profiles: ["training"]

  model-training:
    build: ./model
    environment:
      - SPARK_MASTER_URL=spark://spark-master:7077
    volumes:
      - ./model/data:/app/data
      - ./model/artifacts:/app/artifacts
    depends_on:
      - spark-master
      - spark-worker
    profiles: ["training"]

volumes:
  db_data:
