services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud
      POSTGRES_DB: fraud
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    # Context là repo root: backend có path dependency tới ../model.
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      # +psycopg = driver psycopg 3 (mặc định postgresql:// là psycopg2, không cài).
      DATABASE_URL: postgresql+psycopg://fraud:fraud@db:5432/fraud
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    volumes:
      # Parquet của An KHÔNG nằm trong image: 411MB, và .dockerignore loại cả
      # data/ để build context không phình. Mount lúc chạy, chỉ đọc — thiếu dòng
      # này thì màn "Nạp dữ liệu" báo "chưa có dữ liệu đã tiền xử lý".
      # Đường dẫn cấu hình được: máy dev để trong repo, deployment thật thường
      # để ở volume/NFS riêng. Trên macOS + colima, ~/Documents bị TCC chặn nên
      # cũng cần trỏ ra ngoài.
      - ${DATA_PROCESSED_DIR:-./data/processed}:/app/data/processed:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Xem/sửa Postgres bằng giao diện web. Docker Desktop chỉ quản container và
  # volume, không có trình xem DB — đây là chỗ bù vào.
  # Chạy: docker compose --profile tools up -d adminer  ->  http://localhost:8081
  # Không bật mặc định để buổi demo không phải chạy thêm container.
  # Cổng 8081 chứ không phải 8080: 8080 đã dành cho Spark UI (profile training).
  adminer:
    image: adminer:5
    environment:
      # Chỉ ADMINER_DEFAULT_SERVER được image này dùng. Driver KHÔNG đặt được
      # bằng env (đã thử ADMINER_DEFAULT_DRIVER, không ăn) — Adminer mặc định
      # chọn MySQL nên bấm Login sẽ báo "Connection refused". Phải chọn
      # PostgreSQL trong dropdown, hoặc mở thẳng URL có sẵn tham số:
      #   http://localhost:8081/?pgsql=db&username=fraud&db=fraud
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

  frontend:
    build:
      context: ./frontend
      args:
        # Địa chỉ backend theo góc nhìn của TRÌNH DUYỆT (không phải trong mạng
        # compose) — Vite bake giá trị này vào bundle lúc build.
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

  # --- Spark: chỉ dùng cho training (model/), không cần cho demo chấm điểm.
  # Chạy: docker compose --profile training run --rm model-training uv run python -m fraud_model.train_baseline
  spark-master:
    image: bitnami/spark:3.5.1
    environment:
      - SPARK_MODE=master
    ports:
      - "8080:8080"
      - "7077:7077"
    profiles: ["training"]

  spark-worker:
    image: bitnami/spark:3.5.1
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    depends_on:
      - spark-master
    volumes:
      # Spark standalone executors must see the same absolute Parquet paths as
      # the Python driver.
      - ./data/processed:/data/processed:ro
    profiles: ["training"]

  model-training:
    build: ./model
    environment:
      - SPARK_MASTER_URL=spark://spark-master:7077
      - FRAUD_MODEL_TRAINING_VERSION=v2
      - FRAUD_MODEL_DATA_ROOT=/data/processed/ieee_cis_fraud_risk
    volumes:
      - ./model/data:/app/data
      - ./model/artifacts:/app/artifacts
      - ./data/processed:/data/processed:ro
    depends_on:
      - spark-master
      - spark-worker
    profiles: ["training"]

  model-training-local:
    build: ./model
    environment:
      - SPARK_MASTER_URL=local[*]
      - FRAUD_MODEL_TRAINING_VERSION=v2
      - FRAUD_MODEL_DATA_ROOT=/data/processed/ieee_cis_fraud_risk
    volumes:
      - ./model/data:/app/data
      - ./model/artifacts:/app/artifacts
      - ./data/processed:/data/processed:ro
    profiles: ["training"]

volumes:
  db_data:
